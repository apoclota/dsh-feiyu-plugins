function route(from,to){
 const a=coords[from],b=coords[to];if(!a||!b)return []
 const r=blocks[from],s=blocks[to];if(r===s)return [a,b]
 const lanes=[[[95,28],[97,44],[95,59]],[[37,59],[37,74],[37,90]]]
 const path=[a]
 if(r<s){for(let k=r;k<s;k++)path.push(...lanes[k])}
 else {for(let k=r-1;k>=s;k--)path.push(...lanes[k].slice().reverse())}
 return [...path,b]
}
function along(path,t){
 if(!path.length)return null
 const lengths=path.slice(1).map((b,i)=>Math.hypot((b[0]-path[i][0])*1.5,b[1]-path[i][1]))
 let remaining=Math.min(1,Math.max(0,t))*lengths.reduce((a,b)=>a+b,0)
 for(let i=0;i<lengths.length;i++){if(remaining<=lengths[i]&&lengths[i]){let f=remaining/lengths[i];return path[i].map((a,k)=>a+f*(path[i+1][k]-a))}remaining-=lengths[i]}
 return path.at(-1)
}

function avatar(){const img=document.createElement('img');img.src=state.avatar?.imageUrl||avatarFallback;img.alt='小渊';img.onerror=()=>{img.onerror=null;img.src=avatarFallback};return img}
function select(id,open=false){selected=id;roomOpen=open;inspected=null;$('notice').textContent='';draw()}
function position(n,x,y){n.style.left=x+'%';n.style.top=y+'%'}
function zoom(value){$('zoom').value=value;$('land').style.width=$('zoom').value+'%';$('land').style.minWidth=(770*Number($('zoom').value)/100)+'px'}
$('zoom').oninput=e=>zoom(e.target.value)
$('back').onclick=()=>select(selected)
$('locate').onclick=()=>{if(state){select(state.travel?.inProgress?.to||state.location?.id);$('pins').querySelector('.traveler')?.scrollIntoView({block:'nearest',inline:'center'})}}
const sceneRoot='http://127.0.0.1:18764/scenes/'
let mapUrl, mapRequest
function showMapImage(image){
 if(mapUrl){if(!image.hasAttribute('src'))image.src=mapUrl;return}
 if(!mapRequest)mapRequest=fetch('/oakbrook.webp').then(r=>{
   if(!r.ok)throw Error('地图加载失败')
   return r.blob()
 }).then(blob=>{
   mapUrl=URL.createObjectURL(blob)
   if(!roomOpen)image.src=mapUrl
 }).catch(()=>{$('notice').textContent='地图加载失败，正在重试'}).finally(()=>{mapRequest=null})
}
const view=$('viewport')
view.onwheel=e=>{if(!e.ctrlKey&&!e.shiftKey)return;e.preventDefault();zoom(Number($('zoom').value)+(e.deltaY<0?25:-25))}
let pan
view.onpointerdown=e=>{if(e.pointerType==='mouse'&&e.button===0)pan=[e.clientX,e.clientY,view.scrollLeft,view.scrollTop]}
view.onpointermove=e=>{if(!pan||!e.buttons)return;const dx=e.clientX-pan[0],dy=e.clientY-pan[1];if(Math.abs(dx)+Math.abs(dy)>5){view.setPointerCapture(e.pointerId);view.scrollLeft=pan[2]-dx;view.scrollTop=pan[3]-dy}}
window.addEventListener('pointerup',()=>pan=null)
function draw(){
 const locs=state.locations||[],here=state.location?.id
 const place=locs.find(x=>x.id===selected)||locs.find(x=>x.id===here)||locs[0]
 $('pins').replaceChildren()
 const trip=state.travel?.inProgress
 if(!roomOpen){
 locs.forEach((p,i)=>{const pt=coords[p.id]||[8+i*4,96];const b=button('',()=>select(p.id));b.append(el('span',p.name));b.className='hit';b.setAttribute('aria-pressed',p.id===place?.id);position(b,...pt);$('pins').append(b)})
 const path=trip?route(trip.from,trip.to):selected&&selected!==here?route(here,selected):[]
 if(path.length){
   const ns='http://www.w3.org/2000/svg',overlay=document.createElementNS(ns,'svg'),line=document.createElementNS(ns,'polyline')
   overlay.setAttribute('viewBox','0 0 150 100');overlay.setAttribute('preserveAspectRatio','none');overlay.setAttribute('aria-hidden','true');overlay.classList.add('route')
   line.setAttribute('points',path.map(([x,y])=>(x*1.5)+','+y).join(' '));overlay.append(line);$('pins').prepend(overlay)
 }
 const pos=trip?along(path,Number(trip.progress)||0):coords[here]
 if(pos){const traveler=el('div');traveler.className='traveler';traveler.append(avatar());position(traveler,...pos);$('pins').append(traveler)}
 }
 $('resident').textContent=trip?'前往'+(locs.find(p=>p.id===trip.to)?.name||'目的地')+' · '+Math.round(trip.progress*100)+'%':state.location?.name||'小渊'
 let badge=document.querySelector('.fish-avatar');if(!badge){badge=el('div');badge.className='fish-avatar';$('resident').before(badge)}badge.replaceChildren(avatar())
 const mapImage=$('land').querySelector('img')
 if(roomOpen&&mapImage.hasAttribute('src'))mapImage.removeAttribute('src')
 if(!roomOpen){
   showMapImage(mapImage)
   if($('stage').dataset.scene){$('stage').replaceChildren();$('stage').style.backgroundImage='none';delete $('stage').dataset.scene;$('object-panel').replaceChildren()}
 }
 view.hidden=roomOpen;$('room').hidden=!roomOpen;$('back').hidden=!roomOpen;$('zoom-label').hidden=roomOpen
 $('stats').textContent='现实时间 '+(state.realTime?.local||'--:--')+'　·　精力 '+state.energy+'　／　余额 '+(state.wallet?.balance??state.coins)+' 镇币　·　地点 '+(state.locations||[]).length+'　·　商店 '+(state.shops||[]).length
 $('activity').textContent=[state.realTime?.local,state.weatherEffect,state.currentPhase,state.lastEvent?.text,state.lastAction?.text,(state.npcs||[]).map(n=>n.name+'在'+(state.locations||[]).find(p=>p.id===n.locationId)?.name).join('、')].filter(Boolean).join('　·　')
 const d=$('details');d.replaceChildren();if(!place)return
 d.append(el('small',places[blocks[place.id]]||'街区'),el('h2',place.name),el('p',place.description||''))
 const inside=place.id===here&&!trip
 if(!roomOpen){d.append(button('查看'+(place.id==='moonlake-park'?'湖岸亭':'室内'),()=>select(place.id,true)))}
 else {d.append(el('p',place.interior?.detail||''));drawRoom(place,inside)}
 function control(label,kind,extra={}){const b=button(label,()=>run({id:place.id,kind,...extra}));b.disabled=busy;return b}
 if(!inside && !state.travel?.inProgress){const travelBox=el('div','');travelBox.className='choices';const walk=control('步行进入 · '+(place.walkMinutes||0)+' 分钟','travel',{mode:'walk'});walk.className='primary';travelBox.append(walk);if(place.transitMinutes){travelBox.append(control('交通到达 · '+place.transitMinutes+' 分钟','travel',{mode:'transit'}))}d.append(travelBox)} else if(state.travel?.inProgress){d.append(el('p',`正在前往${locs.find(p=>p.id===state.travel.inProgress.to)?.name||'目的地'}，请等待行程完成。`))}
 else {const group=el('div','');group.className='choices';for(const action of activities[here]||['在附近走走'])group.append(control(action,'act',{action}));d.append(group)}
 if(inside){const home=el('div','');home.className='choices';home.append(control('做湖边工作','work',{jobId:'lake-helper'}));if(place.id==='fish-home'){const decorItems=(state.inventory||[]).filter(x=>x.decor||/灯|架|漆|盆栽|花瓶|长凳|围巾|台灯|邮票/.test(x.name||''));if(decorItems.length){home.append(el('strong','自由布置小屋'));for(const item of decorItems.slice(-6)){const row=el('div','');row.className='row';row.append(el('span',item.name));row.append(control('放到书桌','decorate',{item:item.id,room:'小书桌与日记本',x:35,y:45,rotation:0}));row.append(control('放到窗边','decorate',{item:item.id,room:'收藏瓶与窗边花盆',x:70,y:35,rotation:0}));home.append(row)}}}d.append(home)}
  const shop=state.shops?.find(s=>(s.locationId||s.id)===place.id)
 if(shop){d.append(el('h3','店内物件'));for(const item of shop.items){const row=el('div','');row.className='row';const object=button(`${item.name} · ${item.price} 镇币`,()=>{$('notice').textContent=`你查看了${item.name}。它在${shop.name}的展示架上。`});row.append(object);if(inside)row.append(control('购买','buy',{item:item.id}));d.append(row)}}
  if(inside){
   const npcs=(state.npcs||[]).filter(n=>n.locationId===place.id); if(npcs.length){d.append(el('h3','正在这里的居民'));for(const npc of npcs){const row=el('div','');row.className='row';row.append(el('span',npc.name+' · '+npc.activity));row.append(control('聊几句','npc-talk',{npcId:npc.id,text:'在'+place.name+'见面'}));d.append(row)}}
   const suggest=button('看看此刻发生什么',async()=>{const r=await fetch('/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'event-suggestion'})});const v=await r.json();$('notice').textContent=v.event?.title? v.event.title+'：'+v.event.text : '暂无新的生活建议'});suggest.disabled=busy;d.append(suggest)
  }
  if(place.id==='fish-home'&&(state.homeDecor||[]).length){d.append(el('h3','小屋已布置'));for(const item of state.homeDecor.slice(-8)){const label=state.showDecorDetails===false?item.name:`${item.name} · ${item.room||'小屋'} · ${item.x||50},${item.y||50} · ${item.rotation||0}°`;const row=el('div','');row.className='row';row.append(el('span',label));if(inside&&place.id==='fish-home'){row.append(control('左转','decorate',{item:item.instanceId||item.id,decorAction:'rotate',rotation:(Number(item.rotation)||0)-15}));row.append(control('移动到窗边','decorate',{item:item.instanceId||item.id,decorAction:'move',room:item.room,x:72,y:35,rotation:item.rotation||0}));row.append(control('收回','decorate',{item:item.instanceId||item.id,decorAction:'remove'}))}d.append(row)}}
  if((state.inventory||[]).length){d.append(el('h3','随身物品'));for(const item of state.inventory.slice(-8)){const row=el('div','');row.className='row';row.append(el('span',item.name),inside&&place.id==='fish-home'?control('布置','decorate',{item:item.id}):el('small','已带在身上'));d.append(row)}}
}
// Each hotspot is anchored to the furniture illustrated in its own room.
const objects=[
 [['日记本',78,61],['渔具架',19,38],['窗台',51,48]],
 [['木栈道',48,83],['观景长椅',39,68],['鸟食台',79,54]],
 [['鲜花桶',22,63],['盆栽',73,65],['种子架',78,39]],
 [['面包柜',46,66],['咖啡台',22,49],['砖烤炉',77,45]],
 [['公告栏',26,35],['包裹',74,76],['明信片格',75,38]],
 [['档案架',18,47],['阅览桌',55,76],['旅行书架',74,40]],
 [['餐桌',30,74],['窗边座位',81,71],['汤锅',46,47]],
 [['果蔬箱',28,73],['展示台',73,72],['杂货架',76,44]],
 [['护理柜',26,51],['药瓶架',74,42],['急救台',47,71]],
 [['样品木架',22,51],['工具墙',70,43],['木工台',48,75]],
 [['工具墙',30,38],['材料架',74,47],['修理台',61,74]],
 [['成衣架',74,51],['试衣镜',86,37],['布料台',59,75]],
 [['公告牌',29,43],['纪念票',51,61],['海报架',75,53]],
 [['站台钟',66,32],['检票口',81,61],['候车椅',38,75]]
]
function drawRoom(place,inside){
 const stage=$('stage'),panel=$('object-panel'),cell=cells[place.id]
 stage.replaceChildren();panel.replaceChildren();if(stage.dataset.scene!==place.id){stage.dataset.scene=place.id;stage.style.backgroundImage=Object.hasOwn(cells,place.id)?'url('+sceneRoot+place.id+'.webp)':'none'}
 const commands=activities[place.id]||['在附近走走']
 const goods=state.shops?.find(s=>(s.locationId||s.id)===place.id)?.items||[]
 const dispatch=(kind,extra)=>run({kind,id:place.id,...extra})
 function show(index){
   inspected=index;panel.replaceChildren()
   const prop=objects[cell]?.[index];if(!prop)return
   panel.append(el('strong',prop[0]+'　'))
   const action=commands[index]
   if(inside&&action)panel.append(button(action,()=>dispatch('act',{action})))
   if(!inside)panel.append(el('span','地点预览'))
   goods.filter((_,i)=>i%3===index).forEach(item=>{const label=item.name+' · '+item.price+' 镇币';panel.append(inside?button('购买 '+label,()=>dispatch('buy',{item:item.id})):el('span','　'+label))})
 }
 for(const [index,[name,x,y]] of (objects[cell]||[]).entries()){
   const n=button(name,()=>show(index));n.className='prop';position(n,x,y);stage.append(n)
 }
 if(inspected!==null)show(inspected)
 if(inside){const n=el('span');n.className='person';n.append(avatar());position(n,49,85);stage.append(n)}
 for(const [index,npc] of (state.npcs||[]).filter(n=>n.locationId===place.id).entries()){
   const n=button(npc.name,()=>{panel.replaceChildren(el('span',npc.activity||npc.name));if(inside)panel.append(button('聊几句',()=>dispatch('npc-talk',{npcId:npc.id,text:'在'+place.name+'见面'})))})
   n.className='prop';position(n,18+index*16,85);stage.append(n)
 }
 if(place.id!=='fish-home')return
 for(const item of state.homeDecor||[]){
   const id=item.instanceId||item.id
   const n=button(/灯/.test(item.name)?'🏮':/花|盆/.test(item.name)?'🪴':/椅|凳/.test(item.name)?'🪑':/架|书/.test(item.name)?'📚':'📦',()=>{})
   n.title=item.name;n.setAttribute('aria-label',item.name);n.className='furniture';position(n,item.x??50,item.y??50)
   n.style.transform='translate(-50%,-50%) rotate('+(Number(item.rotation)||0)+'deg)'
   stage.append(n);if(!inside)continue
   let start=null
   n.onpointerdown=e=>{if(busy)return;dragging=true;start=[e.clientX,e.clientY];n.setPointerCapture(e.pointerId)}
   function point(e){const b=stage.getBoundingClientRect();return [Math.round((e.clientX-b.left)/b.width*100),Math.round((e.clientY-b.top)/b.height*100)].map(v=>Math.max(2,Math.min(98,v)))}
   n.onpointermove=e=>{if(start)position(n,...point(e))}
   n.onpointerup=e=>{if(!start)return;const moved=Math.hypot(e.clientX-start[0],e.clientY-start[1])>4;dragging=false;start=null;if(moved){const [x,y]=point(e);dispatch('decorate',{item:id,decorAction:'move',room:item.room,x,y})}else{panel.replaceChildren(el('span',item.name),button('旋转',()=>dispatch('decorate',{item:id,decorAction:'rotate',rotation:(item.rotation||0)+15})),button('收回',()=>dispatch('decorate',{item:id,decorAction:'remove'})))}}
   n.onpointercancel=()=>{start=null;dragging=false;draw()}
 }
}
async function run(payload){if(busy)return;busy=true;revision++;draw();try{const r=await fetch('/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const v=await r.json();if(!r.ok)throw Error(v.error);state=v;$('notice').textContent='已记录'+({travel:'本次步行',buy:'本次购买',act:'本次活动',work:'工作',decorate:'房屋布置'}[payload.kind]||'操作')}catch(e){$('notice').textContent=e.message}finally{busy=false;draw()}}
async function poll(){const version=revision;try{if(busy||dragging)return;const r=await fetch('/state');if(!r.ok)throw Error();const next=await r.json();if(version!==revision||dragging)return;if(JSON.stringify(next)!==JSON.stringify(state)){state=next;draw()}$('sync').textContent='● 已同步 '+new Date().toLocaleTimeString()}catch{$('sync').textContent='连接中断 · 正在重试'}finally{setTimeout(poll,Math.max(1,Number(window.TOWN_REFRESH_SECONDS||2))*1000)}}poll()
</script></html>
