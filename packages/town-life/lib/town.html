const SPRITE_EXT=['png','webp','svg']
const userSprites=new Map()
function loadUserSprite(key,index,done){
  if(userSprites.has(key))return done(userSprites.get(key))
  const ext=SPRITE_EXT[index]
  if(!ext){userSprites.set(key,null);return done(null)}
  const probe=new Image()
  probe.onload=()=>{userSprites.set(key,spriteRoot+key+'.'+ext);done(userSprites.get(key))}
  probe.onerror=()=>loadUserSprite(key,index+1,done)
  probe.src=spriteRoot+key+'.'+ext
}
function spriteEl(key,w,h){
  const model=MODELS[key]||MODELS.box,node=el('div')
  node.className='sprite';node.dataset.sprite=key
  node.style.width=(w||model.w)+'px';node.style.height=(h||model.h)+'px'
  node.innerHTML=model.svg
  loadUserSprite(key,0,src=>{
    if(!src)return
    const img=document.createElement('img');img.src=src;img.alt=''
    img.style.cssText='width:100%;height:100%;object-fit:contain;display:block'
    img.onerror=()=>{node.innerHTML=model.svg}
    node.replaceChildren(img)
  })
  return node
}
function hearts(count){
  const filled=Math.max(0,Math.min(5,Number(count)||0))
  return '♥'.repeat(filled)+'♡'.repeat(5-filled)
}
function affinityEl(affinity){

  wrap.append(el('span',(affinity.label||'初识')+' '+hearts(affinity.hearts)),bar)
  return wrap
}

  const list=rooms||[]
  const hit=list.find(r=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h)
  if(hit)return hit.name
  let best=list[0],bestD=Infinity
  for(const r of list){const dx=x-(r.x+r.w/2),dy=y-(r.y+r.h/2),d=dx*dx+dy*dy;if(d<bestD){bestD=d;best=r}}
  return best?best.name:'客厅'

    const r=document.createElementNS(ns,'rect')
    r.setAttribute('x',room.x);r.setAttribute('y',room.y);r.setAttribute('width',room.w);r.setAttribute('height',room.h)
    r.setAttribute('fill',room.floor||'#d9c3a0');r.setAttribute('stroke','#8d7a5c');r.setAttribute('stroke-width',1);r.setAttribute('rx',2)
    svg.append(r)
    const t=document.createElementNS(ns,'text')
    t.setAttribute('x',room.x+2.5);t.setAttribute('y',room.y+6);t.setAttribute('fill','#6f5f45');t.setAttribute('font-size',3.2);t.textContent=room.name
    svg.append(t)
  }
  const doors=[[56.2,18,2.6,9],[56.2,64,2.6,9],[72,40.4,9,3],[22,60.4,9,3]]
  for(const [x,y,w,h] of doors){
    const d=document.createElementNS(ns,'rect')
    d.setAttribute('x',x);d.setAttribute('y',y);d.setAttribute('width',w);d.setAttribute('height',h)
    d.setAttribute('fill','#f7f1e2');d.setAttribute('rx',1.2)
    svg.append(d)
  }
  stage.append(svg)
  const scale=Math.max(0.55,Math.min(1.15,(stage.clientWidth||620)/560))
  for(const item of home.items){
    const model=MODELS[item.sprite]||MODELS.box
    const n=button('',()=>{})
    n.className='furniture';n.title=item.name;n.setAttribute('aria-label',item.name)
    n.append(spriteEl(item.sprite||spriteGuess(item.name),Math.round(model.w*scale),Math.round(model.h*scale)))
    position(n,item.x??50,item.y??50)
    n.style.transform='translate(-50%,-50%) rotate('+(Number(item.rotation)||0)+'deg)'
    stage.append(n)
    if(!inside)continue
    const id=item.instanceId||item.id
    let start=null
    const point=e=>{const b=stage.getBoundingClientRect();return [Math.round((e.clientX-b.left)/b.width*100),Math.round((e.clientY-b.top)/b.height*100)].map(v=>Math.max(2,Math.min(98,v)))}
    n.onpointerdown=e=>{if(busy)return;dragging=true;start=[e.clientX,e.clientY];n.setPointerCapture(e.pointerId)}
    n.onpointermove=e=>{if(start)position(n,...point(e))}
    n.onpointerup=e=>{
      if(!start)return
      const moved=Math.hypot(e.clientX-start[0],e.clientY-start[1])>4
      dragging=false;start=null
      const [x,y]=point(e)
      if(moved)run({kind:'decorate',id:place.id,item:id,decorAction:'move',room:roomAt(home.rooms,x,y),x,y})
      else panelForItem(item,id,place)
    }
    n.onpointercancel=()=>{start=null;dragging=false;draw()}
  }
  if(home.visitor){
    const person=el('div');person.className='person visitor';person.append(visitorFace(home.visitor))
    position(person,46,52);stage.append(person)
    const bubble=el('div',home.visitor.line||(home.visitor.name+'来小屋串门'));bubble.className='prop visit'
    position(bubble,46,40);stage.append(bubble)
  }
  if(inside){
    const me=el('div');me.className='person';me.append(avatar())
    position(me,home.visitor?26:46,home.visitor?44:44);stage.append(me)
  }
  if(pendingItem&&inside){
    $('notice').textContent='点平面图上想放的位置：'+pendingItem.name
    stage.onclick=e=>{
      if(e.target.closest('.furniture'))return
      const b=stage.getBoundingClientRect()
      const x=Math.max(2,Math.min(98,Math.round((e.clientX-b.left)/b.width*100)))
      const y=Math.max(2,Math.min(98,Math.round((e.clientY-b.top)/b.height*100)))
      const item=pendingItem;pendingItem=null;stage.onclick=null
      run({kind:'decorate',id:place.id,item:item.id,decorAction:'place',room:roomAt(home.rooms,x,y),x,y})
    }
  } else stage.onclick=null
}
function homePanel(d,place,inside){
  const home=currentHome(),comfort=home.comfort||{}
  const card=el('div');card.className='comfort'
  const head=el('div');head.className='comfort-head'
  head.append(el('strong','舒适度 · '+(comfort.label||'简陋')),el('span',(comfort.score||0)+' 点'+(comfort.next?' → '+comfort.next:'') ))
  card.append(head)
  const bar=el('div');bar.className='bar';const fill=document.createElement('i')
  fill.style.width=Math.round((Number(comfort.progress)||0)*100)+'%';bar.append(fill);card.append(bar)
  card.append(el('small',comfort.note||''))
  card.append(el('small',home.visitor?('👋 '+home.visitor.name+'正在做客，'+(home.visitor.line||'')):('邻居串门概率约 '+(home.visitCeiling||0)+'%，舒适度越高越常来。')))
  d.append(card)
  const tabs=el('div');tabs.className='room-tabs'
  const all=button('全部',()=>{activeRoom=null;draw()});if(!activeRoom)all.className='on';tabs.append(all)
  for(const room of home.rooms){const b=button(room.name,()=>{activeRoom=room.id;draw()});if(activeRoom===room.id)b.className='on';tabs.append(b)}
  d.append(tabs)
  const items=home.items.filter(item=>!activeRoom||roomIdOf(home.rooms,item.room)===activeRoom)
  d.append(el('h3','已有家具 · '+items.length+' 件'))
  if(!items.length)d.append(el('small','这间还空着，去家具行挑一件。'))
  for(const item of items){
    const row=el('div');row.className='furn-row'
    row.append(spriteEl(item.sprite||spriteGuess(item.name),26,26),el('span',item.name+' · '+(item.room||'小屋')+' · +'+(item.comfort||0)))
    if(inside){
      row.append(button('旋转',()=>run({kind:'decorate',id:place.id,item:item.instanceId||item.id,decorAction:'rotate',rotation:(Number(item.rotation)||0)+15})))
      row.append(button('收回',()=>run({kind:'decorate',id:place.id,item:item.instanceId||item.id,decorAction:'remove'})))
    }
    d.append(row)
  }
  const owned=(state.inventory||[]).filter(item=>item.decor)
  d.append(el('h3','随身可布置 · '+owned.length+' 件'))
  if(!owned.length)d.append(el('small','背包里没有家具，商店买来的沙发、灯、地毯都能布置。'))
  for(const item of owned){
    const row=el('div');row.className='furn-row owned'
    row.append(spriteEl(item.sprite||spriteGuess(item.name),26,26),el('span',item.name))
    if(inside){const b=button('布置',()=>{pendingItem=item;draw()});row.append(b)}
    d.append(row)
  }
  if(inside){
    const acts=el('div');acts.className='choices'
    for(const action of ['在客厅歇一会儿','在小书桌写日记','给窗边的花浇水']){
      const b=button(action,()=>run({kind:'act',id:place.id,action}));b.disabled=busy;acts.append(b)
    }
    d.append(acts)
  }
}
function giftBox(npc,place){
  const box=el('div');box.className='choices'
  const items=(state.inventory||[]).slice(-3)
  if(!items.length){box.append(el('small','背包里还没有可以送出的东西。'));return box}
  box.append(el('small','送点什么给'+npc.name+'：'))
  for(const item of items){
    const b=button('赠送'+item.name,()=>run({kind:'npc-gift',id:place.id,npcId:npc.id,item:item.id}))
    b.disabled=busy;box.append(b)
  }
  return box
}
function drawRoom(place,inside){
 const stage=$('stage'),panel=$('object-panel'),cell=cells[place.id]
 stage.classList.remove('plan');stage.replaceChildren();panel.replaceChildren();if(stage.dataset.scene!==place.id){stage.dataset.scene=place.id;stage.style.backgroundImage=Object.hasOwn(cells,place.id)?'url('+sceneRoot+place.id+'.webp)':'none'}
 const commands=activities[place.id]||['在附近走走']
 const goods=state.shops?.find(s=>(s.locationId||s.id)===place.id)?.items||[]
 const dispatch=(kind,extra)=>run({kind,id:place.id,...extra})
 function show(index){
   inspected=index;panel.replaceChildren()
   const prop=objects[cell]?.[index];if(!prop)return
   panel.append(el('strong',prop[0]+'　'))
   const action=commands[index]
   if(inside&&action)panel.append(button(action,()=>dispatch('act',{action})))
   if(!inside)panel.append(el('span','地点预览'))
   goods.filter((_,i)=>i%3===index).forEach(item=>{const label=item.name+' · '+item.price+' 镇币';panel.append(inside?button('购买 '+label,()=>dispatch('buy',{item:item.id})):el('span','　'+label))})
 }
 for(const [index,[name,x,y]] of (objects[cell]||[]).entries()){
   const n=button(name,()=>show(index));n.className='prop';position(n,x,y);stage.append(n)
 }
 if(inspected!==null)show(inspected)
 if(inside){const n=el('span');n.className='person';n.append(avatar());position(n,49,85);stage.append(n)}
 for(const [index,npc] of (state.npcs||[]).filter(n=>n.locationId===place.id).entries()){
   const n=button(npc.name,()=>{panel.replaceChildren(el('span',npc.activity||npc.name));if(inside)panel.append(button('聊几句',()=>dispatch('npc-talk',{npcId:npc.id,text:'在'+place.name+'见面'})))})
   n.className='prop';position(n,18+index*16,85);stage.append(n)
 }
 if(place.id!=='fish-home')return
 for(const item of state.homeDecor||[]){
   const id=item.instanceId||item.id
   const n=button('',()=>{});n.append(spriteEl(item.sprite||spriteGuess(item.name)))
   n.title=item.name;n.setAttribute('aria-label',item.name);n.className='furniture';position(n,item.x??50,item.y??50)
   n.style.transform='translate(-50%,-50%) rotate('+(Number(item.rotation)||0)+'deg)'
   stage.append(n);if(!inside)continue
   let start=null
   n.onpointerdown=e=>{if(busy)return;dragging=true;start=[e.clientX,e.clientY];n.setPointerCapture(e.pointerId)}
   function point(e){const b=stage.getBoundingClientRect();return [Math.round((e.clientX-b.left)/b.width*100),Math.round((e.clientY-b.top)/b.height*100)].map(v=>Math.max(2,Math.min(98,v)))}
   n.onpointermove=e=>{if(start)position(n,...point(e))}
   n.onpointerup=e=>{if(!start)return;const moved=Math.hypot(e.clientX-start[0],e.clientY-start[1])>4;dragging=false;start=null;if(moved){const [x,y]=point(e);dispatch('decorate',{item:id,decorAction:'move',room:item.room,x,y})}else{panel.replaceChildren(el('span',item.name),button('旋转',()=>dispatch('decorate',{item:id,decorAction:'rotate',rotation:(item.rotation||0)+15})),button('收回',()=>dispatch('decorate',{item:id,decorAction:'remove'})))}}
   n.onpointercancel=()=>{start=null;dragging=false;draw()}
 }
}
async function run(payload){if(busy)return;busy=true;revision++;draw();try{const r=await fetch('/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const v=await r.json();if(!r.ok)throw Error(v.error);state=v;$('notice').textContent=v.noticeText||('已记录'+({travel:'本次步行',buy:'本次购买',act:'本次活动',work:'工作',decorate:'房屋布置','npc-talk':'聊天','npc-gift':'送礼'}[payload.kind]||'操作'))}catch(e){$('notice').textContent=e.message}finally{busy=false;draw()}}
async function poll(){const version=revision;try{if(busy||dragging)return;const r=await fetch('/state');if(!r.ok)throw Error();const next=await r.json();if(version!==revision||dragging)return;if(JSON.stringify(next)!==JSON.stringify(state)){state=next;draw()}$('sync').textContent='● 已同步 '+new Date().toLocaleTimeString()}catch{$('sync').textContent='连接中断 · 正在重试'}finally{setTimeout(poll,Math.max(1,Number(window.TOWN_REFRESH_SECONDS||2))*1000)}}poll()
</script></html>
